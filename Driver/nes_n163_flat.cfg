MEMORY {
    ZP:         start = $0000, size = $0100, type = rw, define = yes;
    HEADER:     start = $0000, size = $0010, file = "", fill = yes;
    ROM0:       start = $8000, size = $2000, file = "dsp_n163_flat_code.bin", fill = yes;
    ROMF:       start = $e000, size = $1ffa, file = "dsp_n163_flat_data.bin", fill = yes;
    ROMV:       start = $fffa, size = $0006, file = "dsp_n163_flat_data.bin", fill = yes;
    ROMC:       start = $0000, size = $2000, file = "dsp_n163_flat_data.bin", fill = yes;
    STACK:      start = $0100, size = $0200, type = rw, define = yes;
    RAM:        start = $0200, size = $0600, type = rw, define = yes;
}

SEGMENTS {
    HEADER:     load = HEADER, type = ro;
    DSPCODE:    load = ROM0,   type = ro, define = yes;
    CODE:       load = ROMF,   type = ro, define = yes;
    MUSDATA:    load = ROMF,   type = ro, define = yes;
    PCMDATA:    load = ROMF,   type = ro, optional = yes;
    STARTUP:    load = ROMF,   type = ro, define = yes;
    LOWCODE:    load = ROMF,   type = ro, optional = yes;
    INIT:       load = ROMF,   type = ro, define = yes, optional = yes;
    RODATA:     load = ROMF,   type = ro, define = yes;
    VECTORS:    load = ROMV,   type = ro;
    CHARS:      load = ROMC,   type = ro;
    BSS:        load = RAM,    type = bss, define = yes;
    ZEROPAGE:   load = ZP,     type = zp;
}
